[package]
name = "erd-ultra"
version = "0.1.0"
description = "ERD-Ultra – ER-Diagramme, relationale Schemas und Testdaten"
authors = ["gigafrosxh"]
license = "MIT"
repository = "https://github.com/gigafrosxh/erd-ultra"
edition = "2021"

[lib]
name = "erd_ultra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
