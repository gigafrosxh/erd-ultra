name: Build & Release

# Bei jedem Push werden Installer für macOS, Linux und Windows sowie das
# JetBrains-Plugin (.zip) gebaut und als GitHub-Release veröffentlicht:
#   main/master  → stabile Version (Patch/Minor/Major nach Commit-Nachrichten)
#   release/*    → Release-Candidate (x.y.z-rc.N)
#   alle anderen → Pre-Release (x.y.z-beta.N)
#   Tag vX.Y.Z   → genau diese Version
# Mit "[skip release]" in der Commit-Nachricht wird kein Release erstellt.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Versionssprung"
        type: choice
        options: [auto, patch, minor, major, prerelease]
        default: auto

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  version:
    name: Version bestimmen
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: v
        run: node scripts/next-version.mjs
        env:
          BUMP: ${{ github.event.inputs.bump != 'auto' && github.event.inputs.bump || '' }}

  create-release:
    name: Release anlegen
    needs: version
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.r.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          PRE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -e
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$ID" ]; then
            ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="ERD-Ultra $TAG" \
              -F draft=true -F prerelease="$PRE" -F generate_release_notes=true --jq .id)
          fi
          echo "Release-ID: $ID"
          test -n "$ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  build:
    name: Installer (${{ matrix.name }})
    needs: [version, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal)
            os: macos-14
            args: --target universal-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - name: Windows 11
            os: windows-latest
            args: --bundles msi,nsis
    runs-on: ${{ matrix.os }}
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Version setzen
        run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}

      # Update-Pakete (.app.tar.gz, .sig, latest.json) werden mit diesem Schlüssel signiert.
      # Ohne das Secret entstehen nur die Installer, die App öffnet dann beim Aktualisieren die Release-Seite.
      - name: Update-Pakete nur mit Signaturschlüssel
        if: env.HAS_UPDATER_KEY != 'true'
        shell: bash
        run: |
          echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY fehlt – keine In-App-Updates für dieses Release"
          node -e 'const f="src-tauri/tauri.conf.json";const fs=require("fs");const c=JSON.parse(fs.readFileSync(f));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(c,null,2))'

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # RPM verträgt keine Pre-Release-Version → bei Pre-Releases separat im nächsten Schritt
          args: ${{ runner.os == 'Linux' && needs.version.outputs.prerelease == 'true' && '--bundles deb,appimage' || matrix.args }}

      - name: RPM für Pre-Release
        if: runner.os == 'Linux' && needs.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          node scripts/set-version.mjs ${{ needs.version.outputs.version }} --rpm
          npm run tauri build -- --bundles rpm
          gh release upload "$TAG" src-tauri/target/release/bundle/rpm/*.rpm -R "$GITHUB_REPOSITORY" --clobber

  jetbrains-plugin:
    name: JetBrains-Plugin
    needs: [version, create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - run: npm ci

      - name: Version setzen
        run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}

      - name: Plugin bauen
        working-directory: jetbrains-plugin
        run: ./gradlew buildPlugin --no-configuration-cache

      - name: An Release anhängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -e
          cp jetbrains-plugin/build/distributions/*.zip "ERD-Ultra-JetBrains-Plugin-${TAG}.zip"
          gh release upload "$TAG" "ERD-Ultra-JetBrains-Plugin-${TAG}.zip" -R "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Release veröffentlichen
    needs: [version, create-release, build, jetbrains-plugin]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          PRE: ${{ needs.version.outputs.prerelease }}
        run: |
          if [ "$PRE" = "true" ]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
          fi
